name: Build app packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: lexiday-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: lexiday-windows-x64
          path: dist-electron/*-x64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lexiday-android-debug
          path: packages/android
      - uses: actions/download-artifact@v4
        with:
          name: lexiday-windows-x64
          path: packages/windows
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release
          cp packages/android/app-debug.apk release/lexiday-android.apk
          cp packages/windows/*-x64.exe release/lexiday-windows-x64.exe
          cd release
          sha256sum lexiday-android.apk lexiday-windows-x64.exe > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json; then
            test "$(jq -r .isDraft existing-release.json)" = true || { echo 'Release already published; use a new version tag.'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "词屿 $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
